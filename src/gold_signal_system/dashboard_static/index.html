<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XAUUSD Signal Dashboard</title>
  <style>
    :root {
      --primary-green: #0f5c38;
      --dark-green: #063d28;
      --light-green: #e8f5ee;
      --bg: #f7f8f7;
      --card: #ffffff;
      --muted: #7a8984;
      --danger: #c94545;
      --warning: #b7791f;
      --blue: #285b9a;
      --border: #e1e7e4;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: #1f2a26;
    }

    button, input, select, textarea {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: #fbfdfb;
      border-right: 1px solid var(--border);
      padding: 18px 12px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      background: var(--dark-green);
      color: white;
      border-radius: var(--radius);
      padding: 14px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 10px 12px;
      border-radius: var(--radius);
      color: #365046;
      margin-bottom: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .nav-item:hover,
    .nav-item:focus-visible {
      background: #eef4f0;
      outline: none;
    }

    .nav-item.active {
      background: var(--light-green);
      color: var(--dark-green);
      font-weight: 700;
    }

    .main {
      padding: 18px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(210px, 1fr) auto auto auto auto;
      gap: 8px;
      align-items: center;
    }

    .pill, .action-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 13px;
      color: #354b42;
    }

    .live-price-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-color: #b7d8c7;
      background: #f4fbf7;
      min-width: 0;
    }

    .live-price-pill strong {
      color: var(--dark-green);
      font-size: 18px;
      white-space: nowrap;
    }

    .live-price-meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .action-btn {
      cursor: pointer;
      font-weight: 700;
    }

    .action-btn.primary {
      background: var(--primary-green);
      border-color: var(--primary-green);
      color: #fff;
    }

    .action-btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 8px 18px rgba(7, 38, 25, 0.035);
      min-width: 0;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #51665e;
      font-weight: 700;
    }

    .kpi {
      font-size: 28px;
      font-weight: 800;
      color: var(--dark-green);
      overflow-wrap: anywhere;
    }

    .view {
      display: none;
    }

    .view.active {
      display: grid;
      gap: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .market-sessions-card {
      padding: 0;
      overflow: hidden;
    }

    .market-sessions-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .market-sessions-title {
      display: grid;
      gap: 3px;
    }

    .market-sessions-title h3 {
      margin: 0;
      color: #344c42;
    }

    .market-sessions-current {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--dark-green);
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }

    .market-sessions-current time {
      color: var(--muted);
      font-weight: 600;
    }

    .session-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #aab6b1;
      box-shadow: 0 0 0 3px rgba(122, 137, 132, 0.12);
    }

    .market-sessions-current .session-dot,
    .market-session.active .session-dot {
      background: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(15, 92, 56, 0.14);
    }

    .market-session-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      padding: 12px;
      margin: 0;
      list-style: none;
    }

    .market-session {
      display: grid;
      align-content: start;
      gap: 7px;
      min-width: 0;
      min-height: 122px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fbfdfc;
    }

    .market-session.active {
      border-color: #77b493;
      background: linear-gradient(145deg, #f3fbf6 0%, var(--light-green) 100%);
      box-shadow: inset 0 0 0 1px rgba(15, 92, 56, 0.08), 0 8px 18px rgba(15, 92, 56, 0.08);
    }

    .market-session.active.market-closed {
      border-color: #deb56d;
      background: #fff9ed;
      box-shadow: inset 0 0 0 1px rgba(183, 121, 31, 0.08), 0 8px 18px rgba(183, 121, 31, 0.08);
    }

    .market-session.active.market-closed .session-dot {
      background: var(--warning);
      box-shadow: 0 0 0 3px rgba(183, 121, 31, 0.14);
    }

    .market-session-state {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 20px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .market-session.active .market-session-state {
      color: var(--dark-green);
    }

    .market-session-name {
      color: #263d34;
      font-size: 14px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .market-session-time {
      color: #415b50;
      font-size: 17px;
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      white-space: nowrap;
    }

    .market-session-access {
      width: fit-content;
      border-radius: 999px;
      padding: 4px 7px;
      background: #edf1ef;
      color: #61716b;
      font-size: 11px;
      font-weight: 700;
    }

    .market-session-access.enabled {
      background: #d9f2e5;
      color: var(--dark-green);
    }

    .market-session-access.closed {
      background: #fff0d1;
      color: #85540d;
    }

    .market-sessions-note {
      margin: 0;
      padding: 0 14px 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-buy { color: var(--primary-green); }
    .status-sell { color: var(--danger); }
    .status-hold { color: #5d6d68; }
    .status-blocked { color: var(--warning); }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .table th, .table td {
      text-align: left;
      border-bottom: 1px solid var(--border);
      padding: 8px 4px;
      vertical-align: top;
    }

    .table th {
      color: #51665e;
      font-weight: 700;
      width: 36%;
    }

    .badge {
      border-radius: 999px;
      font-size: 12px;
      padding: 4px 8px;
      display: inline-block;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge.buy { background: #d9f2e5; color: var(--dark-green); }
    .badge.sell { background: #fde2e2; color: #932626; }
    .badge.hold { background: #edf1ef; color: #61716b; }
    .badge.warn { background: #fff4da; color: #8a5a12; }
    .badge.info { background: #e8f0fb; color: var(--blue); }

    .muted { color: var(--muted); font-size: 13px; }

    .stack {
      display: grid;
      gap: 8px;
    }

    .field {
      display: grid;
      gap: 5px;
      font-size: 13px;
      color: #51665e;
    }

    .field input,
    .field select,
    .field textarea {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 10px;
      background: #fff;
      color: #1f2a26;
      width: 100%;
    }

    .field textarea {
      min-height: 170px;
      resize: vertical;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .toggle-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .toggle-row {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fbfdfc;
      min-width: 0;
      color: #354b42;
      font-size: 13px;
      font-weight: 700;
    }

    .toggle-row.wide {
      grid-column: 1 / -1;
    }

    .toggle-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary-green);
      flex: 0 0 auto;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .metric-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      background: #fbfdfc;
    }

    .metric-card strong {
      display: block;
      color: var(--dark-green);
      font-size: 22px;
      margin-top: 4px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 28, 23, 0.32);
      display: grid;
      place-items: center;
      z-index: 20;
      padding: 18px;
    }

    .modal {
      width: min(980px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 18px 48px rgba(7, 38, 25, 0.18);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-header h3 { margin: 0; }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .detail-panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      background: #fbfdfc;
      min-width: 0;
    }

    .detail-panel h4 {
      margin: 0 0 10px;
      color: var(--dark-green);
      font-size: 14px;
    }

    .clickable-row { cursor: pointer; }
    .clickable-row:hover { background: #f2f8f5; }

    .log-list {
      display: grid;
      gap: 6px;
      max-height: 460px;
      overflow: auto;
      font-size: 12px;
      font-family: Consolas, "Courier New", monospace;
    }

    .log-item {
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 1100px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        height: auto;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
      }
      .brand { grid-column: 1 / -1; }
      .topbar, .cards, .grid-2, .grid-3, .metric-grid, .detail-grid { grid-template-columns: 1fr; }
      .market-session-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    }

    @media (max-width: 560px) {
      .market-sessions-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .market-sessions-current { text-align: left; }
      .market-session-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Dashboard navigation">
      <div class="brand">XAUUSD Signal Desk</div>
      <button class="nav-item active" type="button" data-view="dashboard">Dashboard</button>
      <button class="nav-item" type="button" data-view="live">Live Signals</button>
      <button class="nav-item" type="button" data-view="execution">Execution</button>
      <button class="nav-item" type="button" data-view="control">Control Unit</button>
      <button class="nav-item" type="button" data-view="history">Signal History</button>
      <button class="nav-item" type="button" data-view="models">Model Ensemble</button>
      <button class="nav-item" type="button" data-view="indicators">Indicators</button>
      <button class="nav-item" type="button" data-view="risk">Risk Center</button>
      <button class="nav-item" type="button" data-view="backtesting">Backtesting</button>
      <button class="nav-item" type="button" data-view="replay">Replay</button>
      <button class="nav-item" type="button" data-view="optimization">Optimization</button>
      <button class="nav-item" type="button" data-view="health">Health</button>
      <button class="nav-item" type="button" data-view="paper">Paper Trading</button>
      <button class="nav-item" type="button" data-view="settings">Settings</button>
      <button class="nav-item" type="button" data-view="logs">Logs</button>
    </aside>

    <main class="main">
      <section class="topbar">
        <div class="pill">Instrument: XAUUSD</div>
        <div class="pill live-price-pill">
          <span>Live Gold</span>
          <strong id="live-price">--</strong>
          <span class="live-price-meta" id="live-price-time">Waiting</span>
        </div>
        <div class="pill" id="timeframe">Timeframe: 5m</div>
        <div class="pill" id="market-status">Provider: Capital.com</div>
        <div class="pill" id="news-status">News: Clear</div>
        <button class="action-btn primary" type="button" data-action="run-cycle">Run Cycle</button>
      </section>

      <section class="cards">
        <div class="card">
          <h3>Current Signal</h3>
          <div class="kpi" id="kpi-signal">--</div>
          <div class="muted" id="kpi-signal-status">Status: --</div>
        </div>
        <div class="card">
          <h3>Model Consensus</h3>
          <div class="kpi" id="kpi-consensus">--</div>
          <div class="muted" id="kpi-agreement">Confidence: --</div>
        </div>
        <div class="card">
          <h3>Risk Quality</h3>
          <div class="kpi" id="kpi-risk">--</div>
          <div class="muted" id="kpi-rr">R:R: --</div>
        </div>
        <div class="card">
          <h3>Today's Performance</h3>
          <div class="kpi" id="kpi-signals">0</div>
          <div class="muted" id="kpi-performance">Win rate: --</div>
        </div>
      </section>

      <section id="view-dashboard" class="view active"></section>
      <section id="view-live" class="view"></section>
      <section id="view-execution" class="view"></section>
      <section id="view-control" class="view"></section>
      <section id="view-history" class="view"></section>
      <section id="view-models" class="view"></section>
      <section id="view-indicators" class="view"></section>
      <section id="view-risk" class="view"></section>
      <section id="view-backtesting" class="view"></section>
      <section id="view-replay" class="view"></section>
      <section id="view-optimization" class="view"></section>
      <section id="view-health" class="view"></section>
      <section id="view-paper" class="view"></section>
      <section id="view-settings" class="view"></section>
      <section id="view-logs" class="view"></section>
    </main>
  </div>

  <script>
    const state = {
      activeView: "dashboard",
      summary: {},
      latest: {},
      votes: [],
      indicators: {},
      risk: {},
      history: { items: [], total: 0, page: 1, page_size: 25 },
      historyFilters: { signal: "", status: "", outcome: "", from_time: "", to_time: "", page: 1, page_size: 25 },
      outcomes: { items: [] },
      artifacts: {},
      performance: {},
      backtest: {},
      backtests: { items: [] },
      backtestFolds: { items: [] },
      backtestTrades: { items: [] },
      selectedBacktestId: null,
      showBacktestModal: false,
      backtestRunStatus: "",
      backtestStatus: { status: "IDLE", active: false, progress: 0 },
      backtestPollTimer: null,
      livePrice: {},
      executionStatus: {},
      controlUnit: { config: {}, sessions: [], current_session: "UNKNOWN", statistics: {} },
      controlSaveStatus: "idle",
      controlSaveError: "",
      executionOrders: { items: [], total: 0, page: 1, page_size: 25 },
      executionFilters: { status: "", outcome: "", direction: "", market_session: "", signal_id: "", from_time: "", to_time: "", page: 1, page_size: 25 },
      executionDetail: { open: false, loading: false, order: null, signal: null, error: "" },
      regime: {},
      timeframes: {},
      newsRisk: {},
      health: {},
      weights: {},
      replay: {},
      activeProfile: {},
      optimizationRuns: { items: [] },
      outcomeSummary: {},
      logs: []
    };

    let controlMutationRevision = 0;
    let controlSaveQueue = Promise.resolve();

    const viewIds = ["dashboard", "live", "execution", "control", "history", "models", "indicators", "risk", "backtesting", "replay", "optimization", "health", "paper", "settings", "logs"];

    function escapeHtml(value) {
      return String(value ?? "--")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function labelClass(value) {
      const text = String(value || "");
      if (text.includes("BUY")) return "status-buy";
      if (text.includes("SELL")) return "status-sell";
      if (text.includes("BLOCKED")) return "status-blocked";
      return "status-hold";
    }

    function badgeClass(value) {
      if (value === "BUY") return "buy";
      if (value === "WIN") return "buy";
      if (value === "SELL") return "sell";
      if (value === "LOSS") return "sell";
      if (value === "HOLD") return "hold";
      if (value === "PARTIAL_TP" || value === "BREAKEVEN") return "info";
      if (String(value || "").includes("BLOCKED")) return "warn";
      if (value === "MISSED_ENTRY" || value === "EXPIRED") return "warn";
      return "info";
    }

    function row(k, v, raw = false) {
      return `<tr><th>${escapeHtml(k)}</th><td>${raw ? v : escapeHtml(v)}</td></tr>`;
    }

    function card(title, body) {
      return `<div class="card"><h3>${escapeHtml(title)}</h3>${body}</div>`;
    }

    function table(rows) {
      return `<table class="table"><tbody>${rows.join("")}</tbody></table>`;
    }

    function formatPercent(value) {
      const n = Number(value || 0);
      return `${Math.round(n * 100)}%`;
    }

    function formatNumber(value, digits = 4) {
      if (value === null || value === undefined || value === "") return "--";
      const n = Number(value);
      return Number.isFinite(n) ? n.toFixed(digits) : String(value);
    }

    function formatPrice(value) {
      if (value === null || value === undefined || value === "") return "--";
      const n = Number(value);
      return Number.isFinite(n) ? n.toFixed(2) : String(value);
    }

    function formatTickTime(value) {
      if (!value) return "Waiting";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function formatSessionName(value) {
      return String(value || "Unknown")
        .toLowerCase()
        .split("_")
        .map(part => part ? `${part[0].toUpperCase()}${part.slice(1)}` : "")
        .join(" ");
    }

    function formatJordanClock(value) {
      if (!value) return "--:--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "--:--";
      return new Intl.DateTimeFormat(undefined, {
        timeZone: "Asia/Amman",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function marketSessionSortValue(session) {
      const [hours, minutes] = String(session?.start || "00:00").split(":").map(Number);
      const startMinutes = (Number.isFinite(hours) ? hours : 0) * 60 + (Number.isFinite(minutes) ? minutes : 0);
      const priorityTieBreak = session?.trading_allowed === false ? 0 : 1;
      return startMinutes * 10 + priorityTieBreak;
    }

    function renderMarketSessions() {
      const control = state.controlUnit || {};
      const stats = control.statistics || {};
      const schedule = [...(control.session_config || stats.session_config || [])]
        .sort((a, b) => marketSessionSortValue(a) - marketSessionSortValue(b));
      const activeSession = stats.current_session || control.current_session || "UNKNOWN";
      const jordanTime = stats.current_session_jordan_time || control.current_session_jordan_time;
      const allowedSessions = control.config?.allowed_sessions || {};

      if (!schedule.length) {
        return card("Market Sessions", `<span class="muted">Session schedule is unavailable.</span>`);
      }

      const items = schedule.map(session => {
        const name = String(session.name || "UNKNOWN");
        const isActive = name === activeSession;
        const marketClosed = session.trading_allowed === false;
        const controlEnabled = Boolean(allowedSessions[name]);
        const accessLabel = marketClosed ? "Market closed" : controlEnabled ? "Control enabled" : "Control disabled";
        const accessClass = marketClosed ? "closed" : controlEnabled ? "enabled" : "";
        const stateLabel = isActive ? "Active now" : "Scheduled";
        return `
          <li
            class="market-session${isActive ? " active" : ""}${marketClosed ? " market-closed" : ""}"
            aria-current="${isActive ? "true" : "false"}"
            aria-label="${escapeHtml(`${formatSessionName(name)}, ${session.start} to ${session.end} Jordan time, ${stateLabel}, ${accessLabel}`)}"
          >
            <div class="market-session-state"><span class="session-dot" aria-hidden="true"></span>${escapeHtml(stateLabel)}</div>

    function updateLivePrice() {
      const tick = state.livePrice || {};
      const priceText = tick.price !== undefined ? formatPrice(tick.price) : "--";
      document.getElementById("live-price").textContent = priceText;
      if (tick.price !== undefined) {
        const spread = Number(tick.ask) - Number(tick.bid);
        const persistedSpread = tick.spread !== undefined ? Number(tick.spread) : spread;
        const spreadText = Number.isFinite(persistedSpread) ? ` | spread ${persistedSpread.toFixed(2)}` : "";
        document.getElementById("live-price-time").textContent = `${formatTickTime(tick.timestamp)}${spreadText}`;
        document.getElementById("market-status").textContent = `Stream: ${tick.status || tick.stream?.status || "Live"}`;
        return;
      }
      const stream = tick.stream || {};
      document.getElementById("live-price-time").textContent = tick.status || stream.status || "Waiting";
      document.getElementById("market-status").textContent = `Stream: ${tick.status || stream.status || "Waiting"}`;
    }

    function addLog(event, data = {}) {
      state.logs.unshift({

        data

      if (state.activeView === "logs") renderLogs();

    async function fetchJson(path, options) {

      if (!response.ok) {

      return response.json();
    }

      ]);

    async function loadExecutionOrders(resetPage = false) {
      const f = state.executionFilters;
      if (resetPage) f.page = 1;
      const params = executionOrderParams(true);
      state.executionOrders = await fetchJson(`/api/execution/orders?${params.toString()}`);
      if (state.activeView === "execution") renderExecution();
    }

    function executionOrderParams(includePaging = false) {
      const f = state.executionFilters;
      const params = new URLSearchParams();
      if (includePaging) {
        params.set("page", String(Math.max(1, f.page || 1)));
        params.set("page_size", String(f.page_size || 25));
      }
      params.set("executed_only", "true");
      if (f.status) params.set("status", f.status);
      if (f.outcome) params.set("outcome", f.outcome);
      if (f.direction) params.set("direction", f.direction);
      if (f.market_session) params.set("market_session", f.market_session);
      if (f.signal_id) params.set("signal_id", f.signal_id);
      if (f.from_time) params.set("from_time", new Date(f.from_time).toISOString());
      if (f.to_time) params.set("to_time", new Date(f.to_time).toISOString());
      return params;
    }

    async function downloadExecutionOrdersJson(button) {
      const params = executionOrderParams(false);
      button.disabled = true;
      try {
        const response = await fetch(`/api/execution/orders/export?${params.toString()}`);
        if (!response.ok) throw new Error(`Export failed with ${response.status}`);
        const blob = await response.blob();
        const disposition = response.headers.get("Content-Disposition") || "";
        const match = disposition.match(/filename="([^"]+)"/);
        const filename = match ? match[1] : `execution_orders_${new Date().toISOString().replaceAll(":", "").replaceAll(".", "")}.json`;
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        addLog("execution.export.downloaded", { filename });
      } finally {
        button.disabled = false;
      }
    }

    async function loadBacktestDetails(runId) {
      if (!runId) return;
      const [folds, trades] = await Promise.all([
        fetchJson(`/api/backtests/${encodeURIComponent(runId)}/windows`),
        fetchJson(`/api/backtests/${encodeURIComponent(runId)}/trades`)

      state.backtestStatus = await fetchJson("/api/backtest/status");
      if (state.backtestStatus?.run_id) {

      if (state.backtestStatus?.status === "COMPLETED") {
        state.backtest = await fetchJson("/api/backtest/summary");

      if (state.activeView === "backtesting") renderBacktesting();
      scheduleBacktestPolling();

      if (state.backtestPollTimer) {

    function orderMarketSession(order) {
      if (order?.market_session) return order.market_session;
      const summary = order?.request_json?.recommendation?.indicator_summary || {};
      const raw = summary.raw_json || {};
      return summary.session || summary.session_name || summary.market_session || raw.session || raw.session_name || raw.market_session || "UNKNOWN";
    }

    function formatCountSummary(counts, emptyText = "No data") {
      const items = Object.entries(counts || {}).filter(([, value]) => Number(value || 0) > 0);
      if (!items.length) return emptyText;
      return items
        .sort((a, b) => Number(b[1] || 0) - Number(a[1] || 0) || String(a[0]).localeCompare(String(b[0])))
        .map(([key, value]) => `${key}: ${value}`)
        .join(" | ");
    }

      return {
        enabled: true,

          LONDON_ACTIVE: true,
          NY_ACTIVE: true,
          ASIA_LOW: true

        allowed_directions: {
          BUY: true,
          SELL: true
        },
        require_ensemble_opposite_or_tie: false,
        apply_to_auto: true,
        apply_to_manual: true,
        tie_policy: "directional_vote_tie"
      };
    }

    function controlConfig() {
      const config = state.controlUnit.config || {};
      return {
        ...defaultControlConfig(),
        ...config,
        allowed_sessions: {
          ...defaultControlConfig().allowed_sessions,
          ...(config.allowed_sessions || {})
        },
        allowed_directions: {
          ...defaultControlConfig().allowed_directions,
          ...(config.allowed_directions || {})

    function renderCountRows(counts, emptyText = "No data") {
      const rows = Object.entries(counts || {}).sort((a, b) => String(a[0]).localeCompare(String(b[0]))).map(([key, value]) => `

    function renderNestedCountRows(counts, emptyText = "No data") {
      const rows = Object.entries(counts || {}).sort((a, b) => String(a[0]).localeCompare(String(b[0]))).map(([key, value]) => `
        <tr>
          <td>${escapeHtml(key)}</td>

      return `
        <table class="table">
          <thead><tr><th>Group</th><th>Counts</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="2">${escapeHtml(emptyText)}</td></tr>`}</tbody>

    function renderControlUnit() {
      const config = controlConfig();
      const controlSaving = state.controlSaveStatus === "saving";
      const controlSaveMessage = controlSaving
        ? "Saving changes..."
        : state.controlSaveStatus === "error"
          ? `Save failed: ${state.controlSaveError || "unknown error"}`
          : state.controlSaveStatus === "saved"
            ? "Saved"
            : "";
      const stats = state.controlUnit.statistics || {};
      const decisionSummary = stats.decision_summary || {};
      const executionSummary = stats.execution_summary || {};

    async function loadControlUnit() {
      const controlLoadRevision = controlMutationRevision;
      const controlLoadBlocked = state.controlSaveStatus === "saving";
      const [controlUnit, controlStats] = await Promise.all([
        fetchJson("/api/execution/control"),
        fetchJson("/api/execution/control/stats")
      ]);
      if (controlLoadBlocked || controlLoadRevision !== controlMutationRevision || state.controlSaveStatus === "saving") return;
      state.controlUnit = { ...(controlUnit || {}), statistics: controlStats || {} };
      if (state.activeView === "control") renderControlUnit();
    }

    function queueControlConfigSave(config) {
      const revision = ++controlMutationRevision;
      state.controlUnit = { ...state.controlUnit, config };
      state.controlSaveStatus = "saving";
      state.controlSaveError = "";
      renderControlUnit();
      controlSaveQueue = controlSaveQueue
        .catch(() => undefined)
        .then(() => persistControlConfig(config, revision));
      return controlSaveQueue;
    }

    async function persistControlConfig(config, revision) {
      try {
        const result = await fetchJson("/api/execution/control", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(config)
        });
        if (revision !== controlMutationRevision) return;
        state.controlUnit = {
          status: result.status,
          sessions: result.sessions || state.controlUnit.sessions || [],
          session_config: result.session_config || state.controlUnit.session_config || [],
          current_session: result.current_session,
          current_session_jordan_time: result.current_session_jordan_time,
          current_session_utc: result.current_session_utc,
          current_session_trading_allowed: result.current_session_trading_allowed,
          config: result.config || config,
          statistics: result.statistics || {}
        };
        state.controlSaveStatus = "saved";
        state.controlSaveError = "";
        addLog("execution.control.updated", result.config || config);
        renderControlUnit();
        try {
          state.executionStatus = await fetchJson("/api/execution/status");
        } catch (statusError) {
          addLog("execution.status.refresh.error", { message: String(statusError) });
        }
      } catch (error) {
        if (revision !== controlMutationRevision) return;
        state.controlSaveStatus = "error";
        state.controlSaveError = String(error);
        addLog("execution.control.update.error", { message: String(error) });
        await loadControlUnit();
        state.controlSaveStatus = "error";
        state.controlSaveError = String(error);
        if (state.activeView === "control") renderControlUnit();
      }
    }

    async function loadHistory(resetPage = false) {
      const f = state.historyFilters;
      if (resetPage) f.page = 1;
      const params = new URLSearchParams();
      params.set("page", String(Math.max(1, f.page || 1)));
      params.set("page_size", String(f.page_size || 25));
      if (f.signal) params.set("signal", f.signal);
      if (f.status) params.set("status", f.status);
      if (f.outcome) params.set("outcome", f.outcome);
      if (f.from_time) params.set("from_time", new Date(f.from_time).toISOString());
      if (f.to_time) params.set("to_time", new Date(f.to_time).toISOString());
      state.history = await fetchJson(`/api/signals/history?${params.toString()}`);
      renderHistory();
    }

    function renderBacktestProgress(status) {
      const item = status || {};

      const active = item.active || item.status === "RUNNING";
      const elapsed = item.elapsed_seconds == null ? "--" : `${item.elapsed_seconds}s`;
      const completedAt = item.completed_at || "--";
      const barColor = active ? "#1c7c54" : item.status === "FAILED" ? "#b42318" : "#5f7f73";
      return `
        <div class="detail-panel">
          <div class="toolbar" style="justify-content:space-between;">
            <div>
              <strong>${escapeHtml(item.run_id || "No active backtest")}</strong>
              <div class="muted">${escapeHtml(item.message || "Backtest worker is idle.")}</div>
            </div>
            <span class="badge ${badgeClass(item.status || "IDLE")}">${escapeHtml(item.status || "IDLE")}</span>
          </div>
          <div style="height:10px; background:#e6efea; border-radius:999px; overflow:hidden; margin:12px 0;">
            <div style="height:100%; width:${progress}%; background:${barColor};"></div>
          </div>
          <div class="grid-3">
            ${metricCard("Progress", `${progress}%`)}
            ${metricCard("Elapsed", elapsed)}
            ${metricCard("Finished", completedAt)}
          </div>
          ${active ? `<div class="muted">This panel refreshes automatically while a backtest is running.</div>` : ""}

      await loadCoreData();
      await loadSupplementalData();
      renderActiveView();

    async function runCycle(button) {
      if (button) button.disabled = true;
      try {
        const payload = await fetchJson("/api/signals/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}"
        });
        addLog("cycle.manual", payload.recommendation || {});
        await refreshAll();
      } finally {
        if (button) button.disabled = false;
      }
    }

    function setActiveView(view) {
      state.activeView = view;
      document.querySelectorAll(".nav-item").forEach(item => item.classList.toggle("active", item.dataset.view === view));
      viewIds.forEach(id => document.getElementById(`view-${id}`).classList.toggle("active", id === view));
      renderActiveView();
    }

    async function handleFormSubmit(form) {
      if (form.dataset.form === "paper-outcome") {
        const data = new FormData(form);
        const payload = {
          recommendation_id: Number(data.get("recommendation_id")),
          outcome: {
            outcome: data.get("outcome"),
            realized_rr: Number(data.get("realized_rr")),
            entry_triggered: form.elements.entry_triggered.checked,
            hit_tp1: form.elements.hit_tp1.checked,
            hit_tp2: form.elements.hit_tp2.checked,
            hit_tp3: form.elements.hit_tp3.checked,
            hit_sl: form.elements.hit_sl.checked
          }
        };
        const result = await fetchJson("/api/paper/outcome", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        addLog("paper.outcome.saved", result);
        await refreshAll();
      }

      if (form.dataset.form === "model-weights" || form.dataset.form === "risk-limits") {
        const payload = JSON.parse(new FormData(form).get("payload"));
        const path = form.dataset.form === "model-weights" ? "/api/settings/model-weights" : "/api/settings/risk-limits";
        const result = await fetchJson(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        addLog(`${form.dataset.form}.saved`, result);
        await refreshAll();
      }

      if (form.dataset.form === "backtest-run") {
        const data = new FormData(form);
        const payload = {
          run_type: data.get("run_type"),
          instrument: data.get("instrument"),
          timeframe: data.get("timeframe"),
          start_date: data.get("start_date"),
          end_date: data.get("end_date"),
          initial_balance: Number(data.get("initial_balance")),
          risk_percent: Number(data.get("risk_percent")),
          model_mode: data.get("model_mode"),
          synthetic_count: 260,
          train_size: 90,
          test_size: 50,
          step_size: 50,
          min_window: 80
        };
        state.backtestRunStatus = "Running backtest...";
        state.showBacktestModal = false;
        renderBacktesting();
        scheduleBacktestPolling();
        const result = await fetchJson("/api/backtests/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        state.backtestRunStatus = `${result.status}: ${result.message || result.run_id}`;
        state.backtestStatus = await fetchJson("/api/backtest/status");
        state.selectedBacktestId = result.run_id;
        addLog("backtest.completed", result);
        await refreshAll();
      }
    }

    function connectEvents() {
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      const socket = new WebSocket(`${protocol}://${location.host}/ws/events`);

      socket.onmessage = async (event) => {
        try {
          const payload = JSON.parse(event.data);
          addLog(payload.event || "ws.event", payload.data || {});
          if (payload.event === "price.tick") {
            state.livePrice = payload.data || {};
            updateLivePrice();
            return;
          }
          if (payload.event === "price.stream.status") {
            state.livePrice = { ...(state.livePrice || {}), stream: payload.data || {}, status: payload.data?.status };
            updateLivePrice();
          }
          if (payload.event === "signal.updated" || payload.event === "risk.blocked" || payload.event === "risk.passed") {
            await refreshAll();
          }
          if (payload.event === "execution.updated") {
            state.executionStatus = await fetchJson("/api/execution/status");
            await loadControlUnit();
            await loadExecutionOrders(false);
            if (state.activeView === "execution") renderExecution();
          }
          if (payload.event === "backtest.auto_market_close") {
            await loadBacktestStatus();
          }
        } catch (err) {
          addLog("ws.error", { message: String(err) });
        }
      };

      socket.onclose = () => {
        addLog("ws.closed");
        setTimeout(connectEvents, 3000);
      };
    }

    document.addEventListener("click", async (event) => {
      const nav = event.target.closest("[data-view]");
      if (nav) {
        setActiveView(nav.dataset.view);
        return;
      }

      const action = event.target.closest("[data-action]");
      if (!action) return;

      if (action.dataset.action === "open-execution-detail") {
        await openExecutionDetail(action.dataset.signalId, action.dataset.orderKey);
        return;
      }
      if (action.dataset.action === "close-execution-detail") {
        closeExecutionDetail();
        return;
      }
      if (action.dataset.action === "run-cycle") await runCycle(action);
      if (action.dataset.action === "execute-latest") {
        action.disabled = true;
        try {
          const result = await fetchJson("/api/execution/execute-latest", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ source: "dashboard" })
          });
          addLog("execution.updated", result);
          state.executionStatus = await fetchJson("/api/execution/status");
          await loadExecutionOrders(false);
          renderExecution();
        } finally {
          action.disabled = false;
        }
      }
      if (action.dataset.action === "refresh-execution") {
        state.executionStatus = await fetchJson("/api/execution/status");
        await loadExecutionOrders(false);
        renderExecution();
      }
      if (action.dataset.action === "refresh-control-unit") {
        await loadControlUnit();
      }
      if (action.dataset.action === "refresh-execution-outcomes") {
        const result = await fetchJson("/api/execution/refresh-outcomes", { method: "POST" });
        addLog("execution.outcomes.refreshed", result);
        await loadExecutionOrders(false);
      }
      if (action.dataset.action === "export-execution-json") {
        await downloadExecutionOrdersJson(action);
      }
      if (action.dataset.action === "clear-execution-filters") {
        state.executionFilters = { status: "", outcome: "", direction: "", market_session: "", signal_id: "", from_time: "", to_time: "", page: 1, page_size: 25 };
        await loadExecutionOrders(true);
      }
      if (action.dataset.action === "execution-prev") {
        state.executionFilters.page = Math.max(1, Number(state.executionFilters.page || 1) - 1);
        await loadExecutionOrders(false);
      }
      if (action.dataset.action === "execution-next") {
        state.executionFilters.page = Number(state.executionFilters.page || 1) + 1;
        await loadExecutionOrders(false);
      }
      if (action.dataset.action === "open-backtest-modal") {
        state.showBacktestModal = true;
        renderBacktesting();
      }
      if (action.dataset.action === "close-backtest-modal") {
        state.showBacktestModal = false;
        renderBacktesting();
      }
      if (action.dataset.action === "refresh-backtests") {
        state.backtestStatus = await fetchJson("/api/backtest/status");
        state.backtest = await fetchJson("/api/backtest/summary");
        state.backtests = await fetchJson("/api/backtests");
        if (state.backtest.run_id) {
          state.selectedBacktestId = state.backtest.run_id;
          await loadBacktestDetails(state.selectedBacktestId);
        }
        renderBacktesting();
      }
      if (action.dataset.action === "select-backtest") {
        state.selectedBacktestId = action.dataset.runId;
        state.backtest = await fetchJson(`/api/backtests/${encodeURIComponent(state.selectedBacktestId)}`);
        await loadBacktestDetails(state.selectedBacktestId);
        renderBacktesting();
      }
      if (action.dataset.action === "refresh-history") {
        await loadHistory(false);
      }
      if (action.dataset.action === "history-prev") {
        state.historyFilters.page = Math.max(1, (state.historyFilters.page || 1) - 1);
        await loadHistory(false);
      }
      if (action.dataset.action === "history-next") {
        state.historyFilters.page = (state.historyFilters.page || 1) + 1;
        await loadHistory(false);
      }
      if (action.dataset.action === "clear-history-filters") {
        state.historyFilters = { signal: "", status: "", outcome: "", from_time: "", to_time: "", page: 1, page_size: state.historyFilters.page_size || 25 };
        await loadHistory(true);
      }
      if (action.dataset.action === "load-replay") {
        state.replay = await fetchJson(`/api/signals/${action.dataset.signalId || state.latest.id || 1}/replay`);
        renderReplay();
      }
      if (action.dataset.action === "run-optimization") {
        const result = await fetchJson("/api/optimization/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ synthetic_count: 260, search_space: { minimum_final_confidence: [0.55], minimum_risk_reward: [1.5] } })
        });
        addLog("optimization.completed", result);
        state.activeProfile = await fetchJson("/api/strategy/profiles/active");
        renderOptimization();
      }
      if (action.dataset.action === "rollback-profile") {
        const result = await fetchJson("/api/strategy/profiles/rollback", { method: "POST" });
        addLog("optimization.rollback", result);
        state.activeProfile = await fetchJson("/api/strategy/profiles/active");
        renderOptimization();
      }
    });

    document.addEventListener("change", async (event) => {
      const historyControl = event.target.closest("[data-history-filter]");
      if (historyControl) {
        const key = historyControl.dataset.historyFilter;
        state.historyFilters[key] = key === "page_size" ? Number(historyControl.value) || 25 : historyControl.value;
        await loadHistory(true);
        return;
      }

      const executionControl = event.target.closest("[data-execution-filter]");
      if (executionControl) {
        const key = executionControl.dataset.executionFilter;
        state.executionFilters[key] = key === "page_size" ? Number(executionControl.value) || 25 : executionControl.value;
        await loadExecutionOrders(true);
      }

      const controlSession = event.target.closest("[data-control-session]");
      if (controlSession) {
        const config = controlConfig();
        const session = controlSession.dataset.controlSession;
        config.allowed_sessions = { ...(config.allowed_sessions || {}), [session]: Boolean(controlSession.checked) };
        await queueControlConfigSave(config);
        return;
      }

      const controlDirection = event.target.closest("[data-control-direction]");
      if (controlDirection) {
        const config = controlConfig();
        const direction = controlDirection.dataset.controlDirection;
        config.allowed_directions = { ...(config.allowed_directions || {}), [direction]: Boolean(controlDirection.checked) };
        await queueControlConfigSave(config);
        return;
      }

      const controlToggle = event.target.closest("[data-control-toggle]");
      if (controlToggle) {
        const config = controlConfig();
        config[controlToggle.dataset.controlToggle] = Boolean(controlToggle.checked);
        await queueControlConfigSave(config);
        return;
      }
    });

    document.addEventListener("submit", async (event) => {
      const form = event.target.closest("form[data-form]");
      if (!form) return;
      event.preventDefault();
      try {
        await handleFormSubmit(form);
      } catch (err) {
        addLog("form.error", { message: String(err) });
      }
    });

    refreshAll().then(() => {
      renderDashboard();
      connectEvents();
    }).catch(err => {
      addLog("dashboard.load.error", { message: String(err) });
      renderLogs();
      setActiveView("logs");
    });
  </script>
</body>
</html>
